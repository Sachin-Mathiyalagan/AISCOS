version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aiscos_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aiscos_hospital.db
      - SECRET_KEY=aiscos-production-super-secret-jwt-key-2026-medical-grade-security
    volumes:
      - ./backend:/app/backend
      - ./ai_models:/app/ai_models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aiscos_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
